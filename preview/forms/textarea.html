<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHSW Textarea Preview</title>
  <link rel="stylesheet" href="../../dist/nhsw.css">
  <link rel="stylesheet" href="../assets/preview.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
</head>
<body>
  <main class="nhsw-width-container">
    <p class="nhsw-body-s"><a href="../index.html">? Back to preview index</a></p>

    <h1 class="nhsw-h1">Textarea</h1>
    <p class="nhsw-body">Examples of textarea sizes and states.</p>

    <section class="preview-section">
      <div class="nhsw-form-group">
        <label class="nhsw-label" for="textarea-default">Default textarea</label>
        <div class="nhsw-hint" id="textarea-default-hint">Use this for longer answers.</div>
        <textarea id="textarea-default" class="nhsw-textarea" placeholder="Enter text" aria-describedby="textarea-default-hint"></textarea>
      </div>

      <div class="nhsw-form-group">
        <label class="nhsw-label" for="textarea-small">Small textarea</label>
        <textarea id="textarea-small" class="nhsw-textarea nhsw-textarea--small"></textarea>
      </div>

      <div class="nhsw-form-group">
        <label class="nhsw-label" for="textarea-large">Large textarea</label>
        <textarea id="textarea-large" class="nhsw-textarea nhsw-textarea--large"></textarea>
      </div>

      <div class="nhsw-form-group nhsw-form-group--error">
        <label class="nhsw-label" for="textarea-error">More detail</label>
        <strong class="nhsw-error-message" id="textarea-error-message">Enter more detail</strong>
        <textarea id="textarea-error" class="nhsw-textarea nhsw-is-invalid" aria-invalid="true" aria-describedby="textarea-error-message"></textarea>
      </div>

      <div class="nhsw-form-group">
        <label class="nhsw-label" for="textarea-disabled">Disabled textarea</label>
        <textarea id="textarea-disabled" class="nhsw-textarea" disabled>Disabled textarea</textarea>
      </div>
    </section>
  </main>
</body>
</html>
