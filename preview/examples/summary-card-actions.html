title: Summary card with actions example

<div class="nhsw-summary-card">
  <div class="nhsw-summary-card__header">
    <h2 class="nhsw-h3 nhsw-summary-card__title">Karen Francis</h2>
    <ul class="nhsw-summary-card__actions">
      <li><a class="nhsw-link" href="#">Cancel</a></li>
      <li><a class="nhsw-link" href="#">Reschedule</a></li>
    </ul>
  </div>
  <div class="nhsw-summary-card__body">
    <dl class="nhsw-summary-list">
      <div class="nhsw-summary-list__row">
        <dt class="nhsw-summary-list__key">Name</dt>
        <dd class="nhsw-summary-list__value">Karen Francis</dd>
        <dd class="nhsw-summary-list__actions"><a class="nhsw-link" href="#">Change<span class="nhsw-visually-hidden"> name</span></a></dd>
      </div>
      <div class="nhsw-summary-list__row">
        <dt class="nhsw-summary-list__key">Appointment date</dt>
        <dd class="nhsw-summary-list__value">15 March 2027</dd>
        <dd class="nhsw-summary-list__actions"><a class="nhsw-link" href="#">Change<span class="nhsw-visually-hidden"> appointment date</span></a></dd>
      </div>
      <div class="nhsw-summary-list__row">
        <dt class="nhsw-summary-list__key">Contact details</dt>
        <dd class="nhsw-summary-list__value">
          <p>07700 900362</p>
          <p>karen.francis@example.com</p>
        </dd>
        <dd class="nhsw-summary-list__actions"><a class="nhsw-link" href="#">Change<span class="nhsw-visually-hidden"> contact details</span></a></dd>
      </div>
    </dl>
  </div>
</div>
