---
layout: example
title: Radios example
---
<div class="nhsw-form-group">
  <fieldset class="nhsw-fieldset" aria-describedby="rd-contact-hint">
    <legend class="nhsw-fieldset__legend nhsw-h2">How do you want to be contacted about this?</legend>
    <div class="nhsw-hint" id="rd-contact-hint">Select 1 option</div>
    <div class="nhsw-radios">
      <div class="nhsw-radios__item">
        <input class="nhsw-radios__input" id="rd-contact-1" name="rd-contact" type="radio" value="email">
        <label class="nhsw-label nhsw-radios__label" for="rd-contact-1">Email</label>
      </div>
      <div class="nhsw-radios__item">
        <input class="nhsw-radios__input" id="rd-contact-2" name="rd-contact" type="radio" value="phone">
        <label class="nhsw-label nhsw-radios__label" for="rd-contact-2">Phone</label>
      </div>
      <div class="nhsw-radios__item">
        <input class="nhsw-radios__input" id="rd-contact-3" name="rd-contact" type="radio" value="text">
        <label class="nhsw-label nhsw-radios__label" for="rd-contact-3">Text message</label>
      </div>
    </div>
  </fieldset>
</div>
