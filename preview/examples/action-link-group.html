<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Action link group example – NHSW Design System</title>
  <link rel="stylesheet" href="../dist/nhsw.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;800&display=swap">
</head>
<body>
  <header class="nhsw-site-header">
    <div class="nhsw-site-header__container nhsw-site-header__container--centered">
      <div class="nhsw-site-header__top">
        <a class="nhsw-site-header__brand" href="../index.html">
          <span class="nhsw-site-header__logo">
            <img src="../assets/nhsw-logo.svg" alt="NHS Wales Digital Health and Care Wales">
          </span>
          <span class="nhsw-site-header__title">Design system</span>
        </a>
      </div>
    </div>
  </header>

  <main class="nhsw-main-wrapper" id="maincontent">
    <div class="nhsw-fluid-container">
      <a class="nhsw-action-link" href="#">
        <svg class="nhsw-action-link__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36" focusable="false" aria-hidden="true">
          <path d="M12 2a10 10 0 0 0-10 9h11.7l-4-4a1 1 0 0 1 1.5-1.4l5.6 5.7a1 1 0 0 1 0 1.4l-5.6 5.7a1 1 0 0 1-1.5 0 1 1 0 0 1 0-1.4l4-4H2A10 10 0 1 0 12 2z" />
        </svg>
        <span class="nhsw-action-link__text">Order a repeat prescription</span>
      </a>
      <a class="nhsw-action-link" href="#">
        <svg class="nhsw-action-link__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36" focusable="false" aria-hidden="true">
          <path d="M12 2a10 10 0 0 0-10 9h11.7l-4-4a1 1 0 0 1 1.5-1.4l5.6 5.7a1 1 0 0 1 0 1.4l-5.6 5.7a1 1 0 0 1-1.5 0 1 1 0 0 1 0-1.4l4-4H2A10 10 0 1 0 12 2z" />
        </svg>
        <span class="nhsw-action-link__text">Book a COVID-19 vaccination</span>
      </a>
      <a class="nhsw-action-link" href="#">
        <svg class="nhsw-action-link__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36" focusable="false" aria-hidden="true">
          <path d="M12 2a10 10 0 0 0-10 9h11.7l-4-4a1 1 0 0 1 1.5-1.4l5.6 5.7a1 1 0 0 1 0 1.4l-5.6 5.7a1 1 0 0 1-1.5 0 1 1 0 0 1 0-1.4l4-4H2A10 10 0 1 0 12 2z" />
        </svg>
        <span class="nhsw-action-link__text">Find your NHS number</span>
      </a>
    </div>
  </main>

  <footer class="nhsw-site-footer">
    <div class="nhsw-site-footer__container">
      <p class="nhsw-body-s nhsw-site-footer__copyright">&copy; Digital Health and Care Wales</p>
    </div>
  </footer>
</body>
</html>
