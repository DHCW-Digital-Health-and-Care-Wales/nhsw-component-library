---
layout: example
title: Check and confirm summary list example
---
<h2 class="nhsw-h2">Check and confirm</h2>
<div class="nhsw-summary-card">
  <div class="nhsw-summary-card__header">
    <h3 class="nhsw-h3 nhsw-summary-card__title">Consent for the flu vaccination</h3>
  </div>
  <div class="nhsw-summary-card__body">
    <dl class="nhsw-summary-list">
      <div class="nhsw-summary-list__row">
        <dt class="nhsw-summary-list__key">Decision</dt>
        <dd class="nhsw-summary-list__value">Consent refused</dd>
        <dd class="nhsw-summary-list__actions"><a class="nhsw-link" href="#">Change</a></dd>
      </div>
      <div class="nhsw-summary-list__row">
        <dt class="nhsw-summary-list__key">Refusal reason</dt>
        <dd class="nhsw-summary-list__value">Personal choice</dd>
        <dd class="nhsw-summary-list__actions"><a class="nhsw-link" href="#">Change</a></dd>
      </div>
    </dl>
  </div>
</div>
<div class="nhsw-summary-card">
  <div class="nhsw-summary-card__header">
    <h3 class="nhsw-h3 nhsw-summary-card__title">About your child</h3>
  </div>
  <div class="nhsw-summary-card__body">
    <dl class="nhsw-summary-list">
      <div class="nhsw-summary-list__row">
        <dt class="nhsw-summary-list__key">Child's name</dt>
        <dd class="nhsw-summary-list__value">Matt Smith</dd>
      </div>
      <div class="nhsw-summary-list__row">
        <dt class="nhsw-summary-list__key">Date of birth</dt>
        <dd class="nhsw-summary-list__value">1 December 2014</dd>
      </div>
      <div class="nhsw-summary-list__row">
        <dt class="nhsw-summary-list__key">School</dt>
        <dd class="nhsw-summary-list__value">Bassaleg School</dd>
        <dd class="nhsw-summary-list__actions"><a class="nhsw-link" href="#">Change</a></dd>
      </div>
    </dl>
  </div>
</div>
<button class="nhsw-button nhsw-button--primary nhsw-button--inline" type="button">Confirm</button>
