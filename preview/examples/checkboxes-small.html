---
layout: example
title: Smaller checkboxes example
---
<div class="nhsw-form-group">
  <fieldset class="nhsw-fieldset">
    <legend class="nhsw-fieldset__legend nhsw-h2">Care setting</legend>
    <div class="nhsw-checkboxes nhsw-checkboxes--small">
      <div class="nhsw-checkboxes__item">
        <input class="nhsw-checkboxes__input" id="setting-1" name="setting" type="checkbox" value="ambulance">
        <label class="nhsw-label nhsw-checkboxes__label" for="setting-1">Ambulance or urgent and emergency care</label>
      </div>
      <div class="nhsw-checkboxes__item">
        <input class="nhsw-checkboxes__input" id="setting-2" name="setting" type="checkbox" value="care-home">
        <label class="nhsw-label nhsw-checkboxes__label" for="setting-2">Care home</label>
      </div>
      <div class="nhsw-checkboxes__item">
        <input class="nhsw-checkboxes__input" id="setting-3" name="setting" type="checkbox" value="community">
        <label class="nhsw-label nhsw-checkboxes__label" for="setting-3">Community health</label>
      </div>
      <div class="nhsw-checkboxes__item">
        <input class="nhsw-checkboxes__input" id="setting-4" name="setting" type="checkbox" value="dentistry">
        <label class="nhsw-label nhsw-checkboxes__label" for="setting-4">Dentistry</label>
      </div>
    </div>
  </fieldset>
</div>
