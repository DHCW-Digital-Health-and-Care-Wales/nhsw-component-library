---
layout: example
title: Date input example
---
<div class="nhsw-form-group">
  <fieldset class="nhsw-fieldset" role="group" aria-describedby="dob-hint">
    <legend class="nhsw-fieldset__legend nhsw-h2">What is your date of birth?</legend>
    <div class="nhsw-hint" id="dob-hint">For example, 15 3 1984</div>
    <div class="nhsw-date-input">
      <div class="nhsw-date-input__item">
        <label class="nhsw-label nhsw-date-input__label" for="dob-day">Day</label>
        <input id="dob-day" name="dob-day" class="nhsw-input nhsw-date-input__input nhsw-date-input__input--day" type="text" inputmode="numeric" maxlength="2" autocomplete="bday-day" value="1">
      </div>
      <div class="nhsw-date-input__item">
        <label class="nhsw-label nhsw-date-input__label" for="dob-month">Month</label>
        <input id="dob-month" name="dob-month" class="nhsw-input nhsw-date-input__input nhsw-date-input__input--month" type="text" inputmode="numeric" maxlength="2" autocomplete="bday-month" value="12">
      </div>
      <div class="nhsw-date-input__item">
        <label class="nhsw-label nhsw-date-input__label" for="dob-year">Year</label>
        <input id="dob-year" name="dob-year" class="nhsw-input nhsw-date-input__input nhsw-date-input__input--year" type="text" inputmode="numeric" maxlength="4" autocomplete="bday-year" value="2000">
      </div>
    </div>
  </fieldset>
</div>
