---
layout: example
title: Smaller radios example
---
<div class="nhsw-form-group">
  <fieldset class="nhsw-fieldset">
    <legend class="nhsw-fieldset__legend nhsw-h2">Filter</legend>
    <div class="nhsw-radios nhsw-radios--small">
      <div class="nhsw-radios__item">
        <input class="nhsw-radios__input" id="filter-monthly" name="filter" type="radio" value="monthly">
        <label class="nhsw-label nhsw-radios__label" for="filter-monthly">Monthly</label>
      </div>
      <div class="nhsw-radios__item">
        <input class="nhsw-radios__input" id="filter-yearly" name="filter" type="radio" value="yearly">
        <label class="nhsw-label nhsw-radios__label" for="filter-yearly">Yearly</label>
      </div>
    </div>
  </fieldset>
</div>
