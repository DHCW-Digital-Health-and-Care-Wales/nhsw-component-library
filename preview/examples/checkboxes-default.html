---
layout: example
title: Checkboxes example
---
<div class="nhsw-form-group">
  <fieldset class="nhsw-fieldset" aria-describedby="cb-contact-hint">
    <legend class="nhsw-fieldset__legend nhsw-h2">How do you want to be contacted about this?</legend>
    <div class="nhsw-hint" id="cb-contact-hint">Select all options that are relevant to you</div>
    <div class="nhsw-checkboxes">
      <div class="nhsw-checkboxes__item">
        <input class="nhsw-checkboxes__input" id="cb-ex-1" name="cb-contact-ex" type="checkbox" value="email">
        <label class="nhsw-label nhsw-checkboxes__label" for="cb-ex-1">Email</label>
      </div>
      <div class="nhsw-checkboxes__item">
        <input class="nhsw-checkboxes__input" id="cb-ex-2" name="cb-contact-ex" type="checkbox" value="phone">
        <label class="nhsw-label nhsw-checkboxes__label" for="cb-ex-2">Phone</label>
      </div>
      <div class="nhsw-checkboxes__item">
        <input class="nhsw-checkboxes__input" id="cb-ex-3" name="cb-contact-ex" type="checkbox" value="text">
        <label class="nhsw-label nhsw-checkboxes__label" for="cb-ex-3">Test message</label>
      </div>
    </div>
  </fieldset>
</div>
