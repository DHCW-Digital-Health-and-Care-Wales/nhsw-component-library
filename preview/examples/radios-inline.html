---
layout: example
title: Inline radios example
---
<div class="nhsw-form-group">
  <fieldset class="nhsw-fieldset">
    <legend class="nhsw-fieldset__legend nhsw-h2">Are you 18 or over?</legend>
    <div class="nhsw-radios nhsw-radios--inline">
      <div class="nhsw-radios__item">
        <input class="nhsw-radios__input" id="over18-yes" name="over18" type="radio" value="yes">
        <label class="nhsw-label nhsw-radios__label" for="over18-yes">Yes</label>
      </div>
      <div class="nhsw-radios__item">
        <input class="nhsw-radios__input" id="over18-no" name="over18" type="radio" value="no">
        <label class="nhsw-label nhsw-radios__label" for="over18-no">No</label>
      </div>
    </div>
  </fieldset>
</div>
