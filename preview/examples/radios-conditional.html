---
layout: example
title: Conditionally revealing radios example
---
<div class="nhsw-form-group">
  <fieldset class="nhsw-fieldset">
    <legend class="nhsw-fieldset__legend nhsw-h2">Is Sam ready for their HPV vaccination?</legend>
    <div class="nhsw-radios">
      <div class="nhsw-radios__item">
        <input class="nhsw-radios__input" id="hpv-ready-yes" name="hpv-ready" type="radio" value="yes">
        <label class="nhsw-label nhsw-radios__label" for="hpv-ready-yes">Yes</label>
      </div>
      <div class="nhsw-radios__item">
        <input class="nhsw-radios__input" id="hpv-ready-no" name="hpv-ready" type="radio" value="no" data-aria-controls="conditional-hpv-ready">
        <label class="nhsw-label nhsw-radios__label" for="hpv-ready-no">No</label>
      </div>
      <div class="nhsw-radios__conditional" id="conditional-hpv-ready">
        <div class="nhsw-form-group">
          <label class="nhsw-label" for="hpv-ready-reason">Give details</label>
          <textarea class="nhsw-textarea" id="hpv-ready-reason" name="hpv-ready-reason" rows="3"></textarea>
        </div>
      </div>
    </div>
  </fieldset>
</div>
