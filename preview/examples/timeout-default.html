layout: example
title: Timeout example
---
<dialog class="nhsw-timeout-modal" open role="dialog" aria-labelledby="timeout-title" aria-describedby="timeout-description">
  <h2 class="nhsw-h3 nhsw-timeout-modal__title" id="timeout-title">You will be logged out soon</h2>
  <p class="nhsw-body nhsw-timeout-modal__text" id="timeout-description">
    For your security, you will be logged out in
    <span aria-hidden="true" data-nhsw-timeout-countdown data-seconds="109">1 minute and 49 seconds</span>.
    <span class="nhsw-visually-hidden" role="status" aria-live="polite" data-nhsw-timeout-live></span>
  </p>
  <button class="nhsw-button nhsw-button--inline" type="button" data-nhsw-timeout-dismiss>Stay logged in</button>
</dialog>
