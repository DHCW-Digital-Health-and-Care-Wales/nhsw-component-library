---
layout: example
title: Inline checkboxes example
---
<div class="nhsw-form-group">
  <fieldset class="nhsw-fieldset">
    <legend class="nhsw-fieldset__legend nhsw-h2">Which nipple has changed?</legend>
    <div class="nhsw-checkboxes nhsw-checkboxes--inline">
      <div class="nhsw-checkboxes__item">
        <input class="nhsw-checkboxes__input" id="nipple-right" name="nipple" type="checkbox" value="right">
        <label class="nhsw-label nhsw-checkboxes__label" for="nipple-right">Right nipple</label>
      </div>
      <div class="nhsw-checkboxes__item">
        <input class="nhsw-checkboxes__input" id="nipple-left" name="nipple" type="checkbox" value="left">
        <label class="nhsw-label nhsw-checkboxes__label" for="nipple-left">Left nipple</label>
      </div>
    </div>
  </fieldset>
</div>
