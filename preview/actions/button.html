<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NHSW Button Preview</title>
    <link rel="stylesheet" href="../dist/nhsw.css">
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
</head>
<body>
  <main class="preview-layout">
    <p><a href="../index.html">? Back to preview index</a></p>
    <h1 class="nhsw-h1">Buttons</h1>

    <section class="preview-section">
        <h2 class="nhsw-h3">Desktop / inline</h2>

        <div class="preview-row">
            <button class="nhsw-button nhsw-button--primary nhsw-button--inline" type="button">
                Primary desktop
            </button>
        </div>
        <br />

        <div class="preview-row">
            <button class="nhsw-button nhsw-button--secondary nhsw-button--inline" type="button">
                Secondary-white desktop
            </button>
        </div>
        <br />

        <div class="preview-row">
            <button class="nhsw-button nhsw-button--exceptional nhsw-button--inline" type="button">
                Exception desktop
            </button>
        </div>
        <br />

        <div class="preview-row">
            <button class="nhsw-button nhsw-button--warning nhsw-button--inline" type="button">
                Warning desktop
            </button>
        </div>
        <br />
    </section>

    <section class="preview-section">
        <h2 class="nhsw-h3">Mobile / full width default</h2>

        <div class="preview-row">
            <button class="nhsw-button nhsw-button--primary" type="button">
                Primary mobile
            </button>
        </div>
        <br />

        <div class="preview-row">
            <button class="nhsw-button nhsw-button--secondary" type="button">
                Secondary mobile
            </button>
        </div>
        <br />
    </section>

    <section class="preview-section">
        <h2 class="nhsw-h3">States</h2>

        <div class="preview-row">
            <button class="nhsw-button nhsw-button--primary nhsw-button--inline" type="button" disabled>
                Disabled primary
            </button>
        </div>
        <br />

        <div class="preview-row">
            <a class="nhsw-button nhsw-button--secondary nhsw-button--inline" href="#">
                Secondary link button
            </a>
        </div>
    </section>
  </main>
</body>
</html>
