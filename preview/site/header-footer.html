<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHSW Header and Footer</title>

  <link rel="stylesheet" href="../../dist/nhsw.css">
  <link rel="stylesheet" href="../assets/preview.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
</head>

<body>

<header class="nhsw-site-header">

  <div class="nhsw-site-header__container">

    <div class="nhsw-site-header__top">

      <a class="nhsw-site-header__brand" href="#">

        <span class="nhsw-site-header__logo">
          <img
            src="../assets/nhsw-logo.svg"
            alt="NHS Wales Digital Health and Care Wales">
        </span>

        <span class="nhsw-site-header__title">
          Design System
        </span>

      </a>

      <form class="nhsw-site-header__search" role="search">

        <label class="nhsw-visually-hidden" for="site-search">
          Search
        </label>

        <input
          id="site-search"
          class="nhsw-site-header__search-input"
          type="search"
          placeholder="Search">

        <button class="nhsw-site-header__search-button"
                type="submit"
                aria-label="Search">
        </button>

      </form>

    </div>

  </div>

</header>

<main class="nhsw-width-container">

  <p class="nhsw-body-s">
    <a href="../index.html">? Back to preview index</a>
  </p>

  <h2 class="nhsw-h2">Example content</h2>

  <p class="nhsw-body">
    Preview page showing NHSW site header and footer styles.
  </p>

</main>

<footer class="nhsw-site-footer">

  <div class="nhsw-site-footer__container">

    <ul class="nhsw-site-footer__links">

      <li>
        <a class="nhsw-link" href="#">
          Accessibility statement
        </a>
      </li>

      <li>
        <a class="nhsw-link" href="#">
          Cookie policy
        </a>
      </li>

      <li>
        <a class="nhsw-link" href="#">
          Terms and conditions
        </a>
      </li>

      <li>
        <a class="nhsw-link" href="#">
          Your privacy
        </a>
      </li>

    </ul>

    <p class="nhsw-body-s nhsw-site-footer__copyright">
      � NHS Wales
    </p>

  </div>

</footer>

</body>
</html>
