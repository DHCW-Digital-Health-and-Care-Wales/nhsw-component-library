<nav class="nhsw-side-nav" aria-label="Section navigation">
  <ul class="nhsw-side-nav__list">
    {% for item in site.data.side_nav %}
      {% if item.url == "#" %}
        <li><a class="nhsw-side-nav__link" href="#"><span>{{ item.title }}</span></a></li>
      {% elsif item.url == page.url %}
        <li><a class="nhsw-side-nav__link nhsw-side-nav__link--current" href="{{ item.url | relative_url }}" aria-current="page"><span>{{ item.title }}</span></a></li>
      {% else %}
        <li><a class="nhsw-side-nav__link" href="{{ item.url | relative_url }}"><span>{{ item.title }}</span></a></li>
      {% endif %}
    {% endfor %}
  </ul>
</nav>
