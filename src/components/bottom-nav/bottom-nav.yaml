name: Bottom navigation
macro: nhswBottomNav
description: >
  Fixed mobile bottom navigation bar, shown only below the tablet breakpoint
  (the header nav bar takes over above it). Add class nhsw-has-bottom-nav to
  <body> so page content gets the bottom padding needed to avoid being
  obscured by the fixed bar.
params:
  - name: items
    type: array
    required: true
    description: >
      [{ text, href, icon, current }] navigation items. icon is raw HTML for
      an inline SVG, rendered inside nhsw-bottom-nav__icon with
      aria-hidden="true". current adds the current-page styling and
      aria-current="page".
  - name: ariaLabel
    type: string
    required: false
    description: aria-label for the nav element. Defaults to "Mobile navigation".
  - name: classes
    type: string
    required: false
    description: Extra classes.
  - name: attributes
    type: object
    required: false
    description: Extra HTML attributes.
examples:
  - name: default
    data:
      items:
        - text: "Appointments"
          href: "/appointments"
          current: true
          icon: "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\" ry=\"2\"/><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"/><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"/><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"/></svg>"
        - text: "Prescriptions"
          href: "/prescriptions"
        - text: "My health"
          href: "/my-health"
        - text: "More"
          href: "/more"
  - name: without-icons
    data:
      items:
        - text: "Appointments"
          href: "/appointments"
          current: true
        - text: "Prescriptions"
          href: "/prescriptions"
